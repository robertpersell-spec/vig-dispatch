<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIG Quote Builder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#0B0F0D; --panel:#151A17; --panel-2:#1C231F; --line:#2A332D;
    --text:#EDEFEC; --muted:#8B978E; --green:#2FAF6B; --green-soft:#248055; --red:#C9634B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding:24px 14px 60px;}
  .wrap{max-width:560px;margin:0 auto;}

  header{margin-bottom:22px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;letter-spacing:.18em;font-size:11px;color:var(--green);text-transform:uppercase;margin-bottom:6px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;margin:0 0 6px;}
  .sub{color:var(--muted);font-size:13.5px;line-height:1.5;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
  h3{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin:0 0 12px;color:var(--green);}

  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=date], input[type=time], input[type=tel]{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:11px 12px;font-family:'Inter',sans-serif;font-size:14.5px;
  }
  input:focus{outline:2px solid var(--green);outline-offset:1px;}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}

  .addr-field{position:relative;margin-bottom:2px;}
  .addr-row{display:flex;gap:8px;align-items:flex-start;}
  .addr-row .addr-field{flex:1;}
  .remove-stop{
    background:var(--panel-2);border:1px solid var(--line);color:var(--red);
    border-radius:7px;padding:0 12px;font-size:16px;cursor:pointer;margin-top:6px;height:42px;
  }
  .suggestions{
    position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel-2);
    border:1px solid var(--line);border-radius:7px;z-index:20;max-height:210px;overflow-y:auto;display:none;
  }
  .suggestions.open{display:block;}
  .suggestions div{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .suggestions div:last-child{border-bottom:none;}
  .suggestions div:hover{background:var(--green);color:#0B0F0D;}
  .suggestions .empty{color:var(--muted);cursor:default;}

  #stops-container{margin-top:2px;}

  button.link{background:none;border:none;color:var(--green);font-size:13px;cursor:pointer;padding:0;margin-top:10px;font-weight:600;}
  button.primary{
    width:100%;margin-top:18px;background:var(--green);color:#0B0F0D;border:none;border-radius:7px;
    padding:13px;font-size:15px;font-weight:600;cursor:pointer;
  }
  button.primary:disabled{opacity:.5;}
  button.secondary{
    width:100%;margin-top:10px;background:var(--panel-2);border:1px solid var(--green);color:var(--green);
    border-radius:7px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;
  }

  .status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-top:10px;min-height:14px;}
  .status.err{color:var(--red);}

  .docket{
    position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:20px;margin-bottom:14px;overflow:hidden;
  }
  .docket::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--green),transparent 70%);}
  .docket-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 0;}
  .docket-line span:last-child{font-family:'IBM Plex Mono',monospace;color:var(--text);}
  .docket-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);margin-top:10px;padding-top:12px;}
  .docket-total .tlabel{font-size:13px;color:var(--muted);}
  .docket-total .tval{font-family:'Fraunces',serif;font-weight:700;font-size:30px;color:var(--green);}
  .min-note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--green);background:rgba(47,175,107,.12);border:1px solid rgba(47,175,107,.35);border-radius:5px;padding:5px 8px;margin-top:10px;display:inline-block;}
  .logo-mark{margin-bottom:14px;}
  .company-title{font-family:'Fraunces',serif;font-weight:700;font-size:22px;letter-spacing:.04em;color:#FFFFFF;text-transform:uppercase;}
  .company-name{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.02em;margin-top:3px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo-mark">
      <div class="company-title">VIG Executive Ltd</div>
      <div class="company-name">Company Registration No: 16777065</div>
    </div>
    <div class="eyebrow">VIG Executive</div>
    <h1>Quote Builder</h1>
    <div class="sub" style="color:var(--muted);">Prices quoted do not include compulsory airport drop-off fees and car park fees on return journeys.</div>
    <div class="sub" style="color:var(--muted);margin-top:6px;">Surcharges may be added for journeys taken between 00:00 and 05:00 and on Bank Holidays.</div>
  </header>

  <div class="card">
    <h3>Client details</h3>
    <div class="row2">
      <div><label for="c-first">Client first name</label><input type="text" id="c-first"></div>
      <div><label for="c-last">Client last name</label><input type="text" id="c-last"></div>
    </div>
    <label for="c-number">Client mobile number</label>
    <input type="tel" id="c-number" placeholder="07…">
    <label for="c-email">Client email</label>
    <input type="text" id="c-email" placeholder="name@example.com">
    <label for="c-flight">Flight number (if airport pick up)</label>
    <input type="text" id="c-flight" placeholder="e.g. BA1326">
    <div class="row2">
      <div><label for="c-date">Date</label><input type="date" id="c-date"></div>
      <div><label for="c-time">Pickup time</label><input type="time" id="c-time"></div>
    </div>
  </div>

  <div class="card">
    <h3>Journey</h3>
    <label>Pickup address</label>
    <div class="addr-field" id="pickup-wrap">
      <input type="text" class="addr-input" autocomplete="off" placeholder="Start typing a UK address…">
      <div class="suggestions"></div>
    </div>

    <div id="stops-container"></div>
    <button class="link" id="add-stop-btn">+ Add a stop en route</button>

    <label style="margin-top:16px;">Drop-off address</label>
    <div class="addr-field" id="dest-wrap">
      <input type="text" class="addr-input" autocomplete="off" placeholder="Start typing a UK address…">
      <div class="suggestions"></div>
    </div>

    <button class="primary" id="quote-btn">Calculate quote</button>
    <div class="status" id="quote-status"></div>
  </div>

  <div id="results"></div>
</div>

<script>
const RATE_PER_MILE = 2.80;
const MINIMUM_FARE = 95;
const CONGESTION_CHARGE = 18;
const NIGHT_FEE = 20;
const BANK_HOLIDAY_SURCHARGE_PCT = 10;

/* UK bank holiday dates (England & Wales), fetched once from gov.uk's public list */
let bankHolidayDatesPromise = (async ()=>{
  try{
    const res = await fetch('https://www.gov.uk/bank-holidays.json');
    if(!res.ok) throw new Error('failed');
    const data = await res.json();
    const events = data['england-and-wales']?.events || [];
    return events.map(e=>e.date); // 'YYYY-MM-DD'
  }catch(e){
    return null; // unavailable — treated as unknown, not auto-flagged
  }
})();

/* Approximate polygon of the London Congestion Charge Zone (since 2011 boundary).
   This is a simplified estimate for automatic detection only — always confirm
   addresses near the zone edge using TfL's own checker if in doubt. The
   checkbox in the results panel is the final word and can be ticked/unticked
   manually regardless of what this detects. */
const CCZ_POLYGON = [
  [-0.1610, 51.5220], [-0.1445, 51.5260], [-0.1190, 51.5300], [-0.0940, 51.5270],
  [-0.0750, 51.5155], [-0.0770, 51.5010], [-0.0980, 51.4950], [-0.1230, 51.4880],
  [-0.1420, 51.4870], [-0.1530, 51.4900], [-0.1520, 51.5025], [-0.1590, 51.5130]
];
function pointInPolygon(point, polygon){
  let x = point.lon, y = point.lat, inside = false;
  for(let i=0, j=polygon.length-1; i<polygon.length; j=i++){
    const xi=polygon[i][0], yi=polygon[i][1], xj=polygon[j][0], yj=polygon[j][1];
    const intersect = ((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function isNightFare(dateVal, timeVal){
  if(!timeVal) return false;
  let jsDate = dateVal ? new Date(`${dateVal}T${timeVal}`) : new Date(`2000-01-01T${timeVal}`);
  const hour = jsDate.getHours();
  return hour >= 0 && hour < 6;
}

/* ---------- Address autocomplete (generic, works on dynamic rows) ---------- */
function debounce(fn, delay){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), delay); }; }

function wireAutocomplete(wrapEl){
  const input = wrapEl.querySelector('.addr-input');
  const list = wrapEl.querySelector('.suggestions');
  input._place = null;

  const runSearch = debounce(async ()=>{
    const q = input.value;
    input._place = null;
    if(q.trim().length < 3){ list.classList.remove('open'); list.innerHTML=''; return; }
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=gb&q=${encodeURIComponent(q)}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('NETWORK_BLOCKED');
      const results = await res.json();
      if(!results.length){ list.innerHTML = '<div class="empty">No matches found</div>'; list.classList.add('open'); return; }
      list.innerHTML = results.map((r,i)=>`<div data-idx="${i}">${r.display_name}</div>`).join('');
      list.classList.add('open');
      list.querySelectorAll('div[data-idx]').forEach((el,i)=>{
        el.addEventListener('click', ()=>{
          input.value = results[i].display_name;
          input._place = { lat: parseFloat(results[i].lat), lon: parseFloat(results[i].lon), label: results[i].display_name };
          list.classList.remove('open'); list.innerHTML='';
        });
      });
    }catch(e){
      list.innerHTML = '<div class="empty">Address lookup unavailable — open this page from its hosted link, not the Claude preview.</div>';
      list.classList.add('open');
    }
  }, 350);

  input.addEventListener('input', runSearch);
  document.addEventListener('click', (e)=>{ if(e.target !== input) list.classList.remove('open'); });
}

wireAutocomplete(document.getElementById('pickup-wrap'));
wireAutocomplete(document.getElementById('dest-wrap'));

/* ---------- Add / remove stops ---------- */
let stopCount = 0;
document.getElementById('add-stop-btn').addEventListener('click', ()=>{
  stopCount++;
  const row = document.createElement('div');
  row.className = 'addr-row';
  row.innerHTML = `
    <div class="addr-field">
      <input type="text" class="addr-input" autocomplete="off" placeholder="Stop ${stopCount} — start typing a UK address…">
      <div class="suggestions"></div>
    </div>
    <button class="remove-stop" title="Remove this stop">×</button>
  `;
  document.getElementById('stops-container').appendChild(row);
  wireAutocomplete(row);
  row.querySelector('.remove-stop').addEventListener('click', ()=>{ row.remove(); });
});

/* ---------- Geocoding / routing ---------- */
async function geocode(address){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q=${encodeURIComponent(address)}`;
  let res; try{ res = await fetch(url); }catch(e){ throw new Error('NETWORK_BLOCKED'); }
  if(!res.ok) throw new Error('Geocoding failed');
  const data = await res.json();
  if(!data.length) throw new Error(`Could not find address: "${address}"`);
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), label: data[0].display_name };
}

async function routeMulti(points){
  const coordStr = points.map(p=>`${p.lon},${p.lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=false`;
  let res; try{ res = await fetch(url); }catch(e){ throw new Error('NETWORK_BLOCKED'); }
  if(!res.ok) throw new Error('Routing failed');
  const data = await res.json();
  if(!data.routes || !data.routes.length) throw new Error('No route found between these addresses');
  const r = data.routes[0];
  return { miles: r.distance * 0.000621371, minutes: r.duration / 60 };
}

function toWaNumber(phone){
  let p = (phone||'').replace(/[^\d+]/g,'');
  if(p.startsWith('+')) return p.slice(1);
  if(p.startsWith('0')) return '44' + p.slice(1);
  if(p.startsWith('44')) return p;
  return p;
}
function fmtDate(d){ if(!d) return ''; const p=d.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }

function generateReference(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  const rand = Math.floor(1000 + Math.random()*9000);
  return `VIG-${y}${m}${d}-${rand}`;
}

let lastQuote = null;

document.getElementById('quote-btn').addEventListener('click', async ()=>{
  const statusEl = document.getElementById('quote-status');
  const resultsEl = document.getElementById('results');
  const btn = document.getElementById('quote-btn');

  const pickupInput = document.querySelector('#pickup-wrap .addr-input');
  const destInput = document.querySelector('#dest-wrap .addr-input');
  const stopInputs = Array.from(document.querySelectorAll('#stops-container .addr-input'));

  if(!pickupInput.value.trim() || !destInput.value.trim()){
    statusEl.textContent = 'Enter both a pickup and drop-off address.';
    statusEl.className = 'status err';
    return;
  }

  btn.disabled = true; statusEl.className = 'status'; resultsEl.innerHTML = ''; lastQuote = null;

  try{
    statusEl.textContent = 'Locating addresses…';
    const allInputs = [pickupInput, ...stopInputs, destInput];
    const points = [];
    for(const input of allInputs){
      if(input._place && input.value === input._place.label){
        points.push(input._place);
      }else{
        points.push(await geocode(input.value.trim()));
      }
    }

    statusEl.textContent = 'Calculating route…';
    const { miles, minutes } = await routeMulti(points);

    const calculated = miles * RATE_PER_MILE;
    const baseFare = Math.max(calculated, MINIMUM_FARE);
    const minimumApplied = baseFare > calculated;

    const pickupPoint = points[0];
    const destPoint = points[points.length-1];
    const congestionDetected = pointInPolygon(pickupPoint, CCZ_POLYGON) || pointInPolygon(destPoint, CCZ_POLYGON);

    const dateVal = document.getElementById('c-date').value;
    const timeVal = document.getElementById('c-time').value;
    const nightApplies = isNightFare(dateVal, timeVal);

    const bankHolidayDates = await bankHolidayDatesPromise;
    const bankHolidayUnknown = dateVal && bankHolidayDates === null;
    const isBankHoliday = !!(dateVal && bankHolidayDates && bankHolidayDates.includes(dateVal));
    const bankHolidayFee = isBankHoliday ? baseFare * (BANK_HOLIDAY_SURCHARGE_PCT/100) : 0;

    lastQuote = {
      miles, minutes, baseFare, minimumApplied, calculated, bankHolidayFee,
      reference: generateReference(),
      pickup: pickupInput.value.trim(),
      dest: destInput.value.trim(),
      stops: stopInputs.map(i=>i.value.trim()).filter(Boolean)
    };

    let html = `<div class="docket">
      <div class="docket-line" style="border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px;"><span>Quote reference</span><span style="color:var(--green);font-weight:600;">${lastQuote.reference}</span></div>
      <div class="docket-line"><span>Distance</span><span>${miles.toFixed(1)} miles</span></div>
      <div class="docket-line"><span>Drive time (approx.)</span><span>${minutes.toFixed(0)} min</span></div>
      ${lastQuote.stops.length ? `<div class="docket-line"><span>Stops en route</span><span>${lastQuote.stops.length}</span></div>` : ''}
      <div class="docket-line"><span>Base fare</span><span>£${baseFare.toFixed(2)}</span></div>
      ${nightApplies ? `<div class="docket-line"><span>Midnight–5am fee</span><span>+£${NIGHT_FEE.toFixed(2)}</span></div>` : ''}
      ${isBankHoliday ? `<div class="docket-line"><span>Bank Holiday surcharge (${BANK_HOLIDAY_SURCHARGE_PCT}%)</span><span>+£${bankHolidayFee.toFixed(2)}</span></div>` : ''}
      ${bankHolidayUnknown ? `<div class="min-note" style="color:var(--muted);background:var(--panel);border-color:var(--line);">Could not check Bank Holiday dates automatically — please verify this date manually.</div>` : ''}

      <label style="margin-top:14px;">Journey amount (£)</label>
      <input type="text" inputmode="decimal" id="fee-journey" value="${(baseFare+ (nightApplies?NIGHT_FEE:0) + bankHolidayFee).toFixed(2)}">

      <label>Airport drop-off fee (£)</label>
      <input type="text" inputmode="decimal" id="fee-airport" value="0.00">

      <label>Airport car park fee (£)</label>
      <input type="text" inputmode="decimal" id="fee-carpark" value="0.00">

      <label>London Congestion Charge (£)${congestionDetected ? ' — detected, please confirm' : ''}</label>
      <input type="text" inputmode="decimal" id="fee-congestion" value="${congestionDetected ? CONGESTION_CHARGE.toFixed(2) : '0.00'}">

      <div class="docket-total"><span class="tlabel">Total</span><span class="tval" id="total-display">£0.00</span></div>
      ${minimumApplied ? `<div class="min-note">Minimum fare applied (calculated: £${calculated.toFixed(2)})</div>` : ''}
      <div class="min-note" style="color:var(--muted);background:var(--panel);border-color:var(--line);">All prices are subject to compulsory airport drop-off fees and car park fees, charged in addition to the price quoted.</div>
      <div class="min-note" style="color:var(--muted);background:var(--panel);border-color:var(--line);">Surcharges may be added for journeys taken between 00:00 and 05:00 and on Bank Holidays.</div>
    </div>`;
    resultsEl.innerHTML = html;
    statusEl.textContent = '';

    const feeIds = ['fee-journey','fee-airport','fee-carpark','fee-congestion'];
    function currentTotal(){
      return feeIds.reduce((sum,id)=>{
        const v = parseFloat(document.getElementById(id).value);
        return sum + (isNaN(v) ? 0 : v);
      }, 0);
    }
    function refreshTotal(){
      lastQuote.total = currentTotal();
      lastQuote.journeyAmount = parseFloat(document.getElementById('fee-journey').value) || 0;
      lastQuote.airportFee = parseFloat(document.getElementById('fee-airport').value) || 0;
      lastQuote.carParkFee = parseFloat(document.getElementById('fee-carpark').value) || 0;
      lastQuote.congestionFee = parseFloat(document.getElementById('fee-congestion').value) || 0;
      document.getElementById('total-display').textContent = `£${lastQuote.total.toFixed(2)}`;
    }
    refreshTotal();
    feeIds.forEach(id=>document.getElementById(id).addEventListener('input', refreshTotal));

    const clientNumber = document.getElementById('c-number').value.trim();
    if(clientNumber){
      const sendBtn = document.createElement('button');
      sendBtn.className = 'secondary';
      sendBtn.style.marginTop = '10px';
      sendBtn.textContent = 'Send booking confirmation & payment request via WhatsApp';
      sendBtn.addEventListener('click', ()=>{
        const first = document.getElementById('c-first').value.trim();
        const last = document.getElementById('c-last').value.trim();
        const fullName = `${first} ${last}`.trim() || 'Client';
        const flight = document.getElementById('c-flight').value.trim();
        const date = document.getElementById('c-date').value;
        const time = document.getElementById('c-time').value;

        const confirmUrl = new URL('confirm-and-pay.html', window.location.href);
        confirmUrl.searchParams.set('ref', lastQuote.reference);
        confirmUrl.searchParams.set('name', fullName);
        confirmUrl.searchParams.set('pickup', lastQuote.pickup);
        confirmUrl.searchParams.set('dest', lastQuote.dest);
        if(lastQuote.stops.length) confirmUrl.searchParams.set('stops', lastQuote.stops.join('|'));
        if(date) confirmUrl.searchParams.set('date', date);
        if(time) confirmUrl.searchParams.set('time', time);
        if(flight) confirmUrl.searchParams.set('flight', flight);
        confirmUrl.searchParams.set('journey', lastQuote.journeyAmount.toFixed(2));
        confirmUrl.searchParams.set('airport', lastQuote.airportFee.toFixed(2));
        confirmUrl.searchParams.set('carpark', lastQuote.carParkFee.toFixed(2));
        confirmUrl.searchParams.set('congestion', lastQuote.congestionFee.toFixed(2));
        confirmUrl.searchParams.set('total', lastQuote.total.toFixed(2));

        let msg = `Hi ${first||'there'}, thank you for booking with VIG Executive.\n\n`;
        msg += `Quote ref: ${lastQuote.reference}\n\n`;
        msg += `Please confirm your journey details and authorise your card here:\n${confirmUrl.toString()}\n\n`;
        msg += `Total: £${lastQuote.total.toFixed(2)}. No payment is taken until your journey is complete.`;

        window.open(`https://wa.me/${toWaNumber(clientNumber)}?text=${encodeURIComponent(msg)}`, '_blank');
      });
      resultsEl.appendChild(sendBtn);
    }

    const clientEmail = document.getElementById('c-email').value.trim();
    if(clientEmail){
      const emailBtn = document.createElement('button');
      emailBtn.className = 'secondary';
      emailBtn.style.marginTop = '10px';
      emailBtn.textContent = 'Send booking confirmation & payment request via Email';
      emailBtn.addEventListener('click', ()=>{
        const first = document.getElementById('c-first').value.trim();
        const date = document.getElementById('c-date').value;
        const time = document.getElementById('c-time').value;
        const flight = document.getElementById('c-flight').value.trim();

        const confirmUrl = new URL('confirm-and-pay.html', window.location.href);
        confirmUrl.searchParams.set('ref', lastQuote.reference);
        confirmUrl.searchParams.set('name', `${first} ${document.getElementById('c-last').value.trim()}`.trim() || 'Client');
        confirmUrl.searchParams.set('pickup', lastQuote.pickup);
        confirmUrl.searchParams.set('dest', lastQuote.dest);
        if(lastQuote.stops.length) confirmUrl.searchParams.set('stops', lastQuote.stops.join('|'));
        if(date) confirmUrl.searchParams.set('date', date);
        if(time) confirmUrl.searchParams.set('time', time);
        if(flight) confirmUrl.searchParams.set('flight', flight);
        confirmUrl.searchParams.set('journey', lastQuote.journeyAmount.toFixed(2));
        confirmUrl.searchParams.set('airport', lastQuote.airportFee.toFixed(2));
        confirmUrl.searchParams.set('carpark', lastQuote.carParkFee.toFixed(2));
        confirmUrl.searchParams.set('congestion', lastQuote.congestionFee.toFixed(2));
        confirmUrl.searchParams.set('total', lastQuote.total.toFixed(2));

        const subject = `Your VIG Executive booking confirmation — Ref ${lastQuote.reference}`;
        const body = `Hi ${first||'there'},\n\nThank you for booking with VIG Executive.\n\nQuote ref: ${lastQuote.reference}\n\nPlease confirm your journey details and authorise your card here:\n${confirmUrl.toString()}\n\nTotal: £${lastQuote.total.toFixed(2)}. No payment is taken until your journey is complete.\n\nKind regards,\nVIG Executive Ltd`;

        window.location.href = `mailto:${clientEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      });
      resultsEl.appendChild(emailBtn);
    }
  }catch(err){
    if(err.message === 'NETWORK_BLOCKED'){
      statusEl.textContent = 'Address lookup unavailable in this preview — open the hosted link instead.';
    }else{
      statusEl.textContent = err.message || 'Something went wrong.';
    }
    statusEl.className = 'status err';
  }finally{
    btn.disabled = false;
  }
});
</script>
</body>
</html>
