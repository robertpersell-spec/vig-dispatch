<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>VIG Executive Cars</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap');
:root{
  --bg:#000000; --panel:#0A0A0A; --panel-2:#141414; --line:#2A2A2A;
  --text:#FFFFFF; --muted:#9A9A9A; --green:#6FC18B; --red:#E0775F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
body{padding:0 0 40px;}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 0;}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;max-width:560px;margin:0 auto;}
header img{width:36px;height:36px;display:block;}
header .t{font-family:'Fraunces',serif;font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase;}
h2{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:6px 0 12px;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;}
.chip{flex:none;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
.chip.on{background:var(--green);color:#000;border-color:var(--green);}
.day{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;}
.job{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;}
.job.late{border-color:var(--red);}
.job-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.time{font-weight:600;font-size:16px;}
.route{font-size:14px;line-height:1.4;}
.sub{font-size:12.5px;color:var(--muted);margin-top:6px;}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:4px 10px;border:1px solid var(--line);color:var(--muted);}
.st-offered{color:#fff;border-color:#fff;}
.st-allocated{color:var(--green);border-color:var(--green);}
.st-confirmed{background:var(--green);color:#000;border-color:var(--green);}
.st-completed{background:#fff;color:#000;border-color:#fff;}
.st-paid{color:var(--muted);}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px;line-height:1.6;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;}
.card h3{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin:0 0 12px;color:var(--green);}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px;}
input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:11px 12px;color:var(--text);font-size:15px;font-family:inherit;margin-bottom:12px;}
textarea{min-height:90px;resize:vertical;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
button.btn{width:100%;border:none;border-radius:8px;padding:13px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--green);color:#000;margin-top:2px;}
button.btn.sec{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
button.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
button.link{background:none;border:none;color:var(--green);font-size:15px;font-family:inherit;cursor:pointer;padding:6px 0;}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btnrow .btn{margin-top:0;}
.step{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--green);color:#000;font-size:12px;font-weight:700;text-align:center;line-height:22px;margin-right:8px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.ref{font-size:12px;color:var(--muted);}
.warn{background:#2a1510;border:1px solid var(--red);color:#ffd9cf;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;margin-bottom:12px;}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:-4px 0 12px;}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px;margin:4px 0 12px;}
.total b{font-family:'Fraunces',serif;font-size:22px;color:var(--green);}
details summary{cursor:pointer;color:var(--green);font-size:14px;font-weight:600;margin-bottom:10px;}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#000;border-bottom:1px solid var(--line);padding:6px 16px 10px;}
nav .in{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;width:100%;max-width:528px;margin:0 auto;}
nav button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:12px 6px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;}
nav button.new{background:var(--green);color:#000;border-color:var(--green);}
a.btn.sec{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
a.btn{display:block;text-align:center;text-decoration:none;width:100%;border-radius:8px;padding:13px;font-size:14.5px;font-weight:600;background:var(--green);color:#000;}
#sheet .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;}
#sheet .sheet-in{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));z-index:21;max-height:88vh;overflow-y:auto;}
#sheet .sheet-in h3{font-family:'Fraunces',serif;font-size:16px;margin:0 0 10px;color:var(--green);}
#sheet textarea{min-height:190px;font-size:14px;line-height:1.45;}
#sugg{position:absolute;z-index:9;background:var(--panel-2);border:1px solid var(--green);border-radius:8px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.7);}
#sugg .si{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;}
#sugg .si:last-child{border-bottom:none;}
#sugg .sl{font-size:14px;}
#sugg .ss{font-size:12px;color:var(--muted);margin-top:2px;}
#toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:24px;background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;display:none;z-index:9;max-width:90%;text-align:center;}
.drv{border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:12px;}
</style>
</head>
<body>
<header><img src="vig-logo.jpg" alt="VIG"><span class="t">VIG Executive Cars</span><span id="syncstat" style="margin-left:auto;font-size:11px;color:#9A9A9A;text-align:right"></span></header>
<nav><div class="in">
  <button data-nav="list">Jobs</button>
  <button class="new" data-nav="new">+ New job</button>
  <button data-nav="drivers">Drivers</button>
</div></nav>
<div class="wrap" id="app"></div>

<div class="ver" style="text-align:center;color:#555;font-size:11px;padding:18px 0 4px;">Version 10 with sync</div>
<div id="toast"></div>

<script>
(function(){
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DAYSL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];

  /* ---------- storage ---------- */
  var storageOK = true;
  function sGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ storageOK=false; return d; } }
  function sSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ storageOK=false; } }
  var jobs = sGet('vig_jobs_v1',[]);
  var drivers = sGet('vig_drivers_v1',null) || [
    {id:'d1',name:'David Beckwith',phone:'',vehicle:'',_seed:true},
    {id:'d2',name:'Jon Gotkine',phone:'',vehicle:'',_seed:true}
  ];
  function saveJobs(){ sSet('vig_jobs_v1',jobs); }
  function saveDrivers(){ sSet('vig_drivers_v1',drivers); }

  /* ---------- helpers ---------- */
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function isoToDate(iso){ var p=iso.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function fmtShort(iso){ if(!iso) return 'No date'; var d=isoToDate(iso); return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }
  function fmtLong(iso){ if(!iso) return 'TBC'; var d=isoToDate(iso); return DAYSL[d.getDay()]+' '+d.getDate()+' '+MONL[d.getMonth()]+' '+d.getFullYear(); }
  function dayLabel(iso){
    if(!iso) return 'No date';
    var t=todayISO(); if(iso===t) return 'Today';
    var tm=new Date(); tm.setDate(tm.getDate()+1);
    var tmISO=tm.getFullYear()+'-'+pad(tm.getMonth()+1)+'-'+pad(tm.getDate());
    return iso===tmISO ? 'Tomorrow' : fmtShort(iso);
  }
  function money(n){ return '\u00A3'+(Number(n)||0).toFixed(2); }
  function toMin(t){ var p=t.split(':').map(Number); return p[0]*60+p[1]; }
  function firstName(n){ var f=String(n||'').trim().split(/\s+/)[0]; return f||'there'; }
  function v(x){ return x||'TBC'; }
  function normPhone(p){
    var d=String(p||'').replace(/[^\d+]/g,'');
    if(d.charAt(0)==='+') d=d.slice(1);
    else if(d.indexOf('00')===0) d=d.slice(2);
    else if(d.charAt(0)==='0') d='44'+d.slice(1);
    d=d.replace(/\D/g,'').replace(/^440/,'44');
    return d;
  }
  function genRef(){ var d=new Date(); return 'VIG-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+Math.floor(1000+Math.random()*9000); }
  function newJob(){
    return {id:'j'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),ref:genRef(),status:'new',
      name:'',phone:'',date:'',time:'',pickup:'',stops:'',dest:'',flight:'',pax:'',notes:'',
      price:'',driverFee:'',driverId:'',vehicle:'',offered:[],extras:'',extrasNote:'',link:''};
  }
  function stopList(j){ return String((j&&j.stops)||'').split(/\r?\n|;/).map(function(x){return x.trim();}).filter(Boolean); }
  function stopsLine(j){ var l=stopList(j); return l.length?'Additional stops: '+l.join(', '):''; }
  function getDriver(id){ for(var i=0;i<drivers.length;i++) if(drivers[i].id===id) return drivers[i]; return null; }
  function toast(msg){ var t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},2600); }

  var STATUSES=[['new','New'],['offered','Offered'],['allocated','Allocated'],['confirmed','Confirmed'],['completed','Completed'],['paid','Paid']];
  function stLabel(s){ for(var i=0;i<STATUSES.length;i++) if(STATUSES[i][0]===s) return STATUSES[i][1]; return s; }

  /* ---------- state ---------- */
  var view='list', filter='open', cur=null;
  var app=$('#app');

  function meaningful(j){ return !!(j.name||j.pickup||j.dest||j.phone); }
  function persistCur(){
    if(!cur||!meaningful(cur)) return;
    var i=jobs.indexOf(cur);
    if(i<0) jobs.push(cur);
    var sg=sig(cur); if(cur._sig!==sg){ cur._sig=sg; markDirty(cur); }
    saveJobs(); scheduleSync();
    var ss=$('select[data-f="status"]'); if(ss && ss.value!==cur.status) ss.value=cur.status;
  }

  /* ---------- list view ---------- */
  var FILTERS=[['open','Open'],['pay','Payment due'],['paid','Paid'],['all','All']];
  function matches(j){
    if(filter==='all') return true;
    if(filter==='open') return ['new','offered','allocated','confirmed'].indexOf(j.status)>-1;
    if(filter==='pay') return j.status==='completed';
    return j.status==='paid';
  }
  function key(j){ return (j.date||'9999-99-99')+(j.time||'99:99'); }
  function renderList(){
    hideSugg(); view='list'; cur=null;
    var list=jobs.filter(matches).sort(function(a,b){ return key(a)<key(b)?-1:1; });
    if(filter==='paid') list.reverse();
    var chips=FILTERS.map(function(f){
      var n=jobs.filter(function(j){ var old=filter; filter=f[0]; var m=matches(j); filter=old; return m; }).length;
      return '<button class="chip'+(filter===f[0]?' on':'')+'" data-filter="'+f[0]+'">'+f[1]+' ('+n+')</button>';
    }).join('');
    var html='';
    if(!storageOK) html+='<div class="warn">Your browser is not saving data (private browsing?). Jobs will be lost when you close this page.</div>';
    html+='<div class="chips">'+chips+'</div>';
    if(!list.length){
      html+='<div class="empty">No jobs here yet.<br>Tap + New job to add one.</div>';
    } else {
      var last='', today=todayISO();
      list.forEach(function(j){
        var d=j.date||'';
        if(d!==last){ html+='<div class="day">'+esc(dayLabel(d))+'</div>'; last=d; }
        var late = ['new','offered','allocated','confirmed'].indexOf(j.status)>-1 && j.date && j.date<today;
        var drv=getDriver(j.driverId);
        var bits=[]; if(j.name) bits.push(esc(j.name)); if(drv) bits.push(esc(drv.name)); if(j.price) bits.push(money(j.price));
        html+='<div class="job'+(late?' late':'')+'" data-id="'+esc(j.id)+'">'+
          '<div class="job-top"><span class="time">'+esc(j.time||'Time TBC')+'</span><span class="pill st-'+esc(j.status)+'">'+esc(stLabel(j.status))+'</span></div>'+
          '<div class="route">'+esc(j.pickup||'Pickup TBC')+' to '+esc(j.dest||'Drop off TBC')+(stopList(j).length?' <span style="color:var(--muted)">('+stopList(j).length+(stopList(j).length>1?' stops':' stop')+')</span>':'')+'</div>'+
          '<div class="sub">'+bits.join(' \u00B7 ')+'</div></div>';
      });
    }
    app.innerHTML=html; window.scrollTo(0,0);
  }

  /* ---------- editor view ---------- */
  function fld(label,f,val,type,extra){
    return '<label>'+label+'</label><input data-f="'+f+'" type="'+(type||'text')+'" value="'+esc(val)+'" autocomplete="off" autocorrect="off" '+(extra||'')+'>';
  }
  function driverOptions(sel){
    return '<option value="">Choose driver</option>'+drivers.map(function(d){
      return '<option value="'+esc(d.id)+'"'+(d.id===sel?' selected':'')+'>'+esc(d.name)+'</option>';
    }).join('');
  }
  function renderEditor(){
    hideSugg(); view='job'; var j=cur;
    var isNew=jobs.indexOf(j)<0;
    var html='<div class="topbar"><button class="link" data-act="back">\u2039 Jobs</button><span class="ref">'+esc(j.ref)+'</span></div>';
    html+='<div class="card"><label>Status</label><select data-f="status" style="margin-bottom:0">'+
      STATUSES.map(function(s){return '<option value="'+s[0]+'"'+(j.status===s[0]?' selected':'')+'>'+s[1]+'</option>';}).join('')+'</select></div>';

    html+='<div class="card"><details'+(isNew?' open':'')+'><summary>Paste a WhatsApp message to fill this in</summary>'+
      '<textarea id="paste" placeholder="Paste the client\'s message or enquiry here"></textarea>'+
      '<button class="btn sec" data-act="parse">Fill in the details</button></details></div>';

    html+='<div class="card"><h3>Job details</h3>'+
      fld('Client name','name',j.name)+
      fld('Client mobile','phone',j.phone,'tel','inputmode="tel"')+
      '<div class="row2"><div>'+fld('Date','date',j.date,'date')+'</div><div>'+fld('Pickup time','time',j.time,'time')+'</div></div>'+
      fld('Pickup address','pickup',j.pickup)+
      '<label>Additional stops (optional, one per line)</label><textarea data-f="stops" autocomplete="off" style="min-height:60px" placeholder="Any stops between pickup and drop off">'+esc(j.stops)+'</textarea>'+
      fld('Drop off address','dest',j.dest)+
      '<div class="row2"><div>'+fld('Flight (optional)','flight',j.flight)+'</div><div>'+fld('Passengers','pax',j.pax,'number','inputmode="numeric" min="1"')+'</div></div>'+
      '<label>Notes</label><textarea data-f="notes" style="min-height:60px">'+esc(j.notes)+'</textarea></div>';

    html+='<div class="card"><h3>Money</h3><div class="row2"><div>'+
      fld('Client fare (\u00A3)','price',j.price,'number','inputmode="decimal" step="0.01" min="0"')+'</div><div>'+
      fld('Driver fee (\u00A3)','driverFee',j.driverFee,'number','inputmode="decimal" step="0.01" min="0"')+'</div></div>'+
      '<div class="note" id="margin"></div></div>';

    html+='<div id="clash"></div>';

    html+='<div class="card"><h3><span class="step">1</span>Offer to a driver</h3>'+
      '<label>Driver</label><select data-f="driverId">'+driverOptions(j.driverId)+'</select>'+
      '<div class="note" id="offered"></div>'+
      '<button class="btn" data-act="offer">Send offer on WhatsApp</button></div>';

    html+='<div class="card"><h3><span class="step">2</span>Allocate</h3>'+
      '<label>Vehicle</label><input id="f-vehicle" data-f="vehicle" type="text" value="'+esc(j.vehicle)+'" placeholder="e.g. Black Mercedes V Class">'+
      '<button class="btn" data-act="allocate">Allocate this driver</button></div>';

    html+='<div class="card"><h3><span class="step">3</span>Confirm</h3>'+
      '<div class="btnrow"><button class="btn" data-act="confClient">Confirm to client</button><button class="btn" data-act="confDriver">Confirm to driver</button></div>'+
      '<button class="btn sec" data-act="diary" style="margin-top:10px">Add to my diary</button></div>';

    html+='<div class="card"><h3><span class="step">4</span>After the journey</h3>'+
      '<div class="row2"><div>'+fld('Extras (\u00A3)','extras',j.extras,'number','inputmode="decimal" step="0.01" min="0"')+'</div><div>'+fld('What for','extrasNote',j.extrasNote)+'</div></div>'+
      fld('SumUp payment link','link',j.link,'url','inputmode="url" placeholder="Paste the link from SumUp"')+
      '<div class="total"><span style="color:var(--muted);font-size:13px">Total to collect</span><b id="total"></b></div>'+
      '<button class="btn sec" data-act="complete" style="margin-bottom:10px">Mark completed</button>'+
      '<button class="btn" data-act="payreq">Send payment request</button>'+
      '<button class="btn sec" data-act="paid" style="margin-top:10px">Mark paid</button></div>';

    html+='<div class="card"><h3>More</h3><div class="btnrow"><button class="btn sec" data-act="dup">Copy this job</button><button class="btn sec" data-act="ret">Add return journey</button></div>'+
      (isNew?'':'<button class="btn danger" data-act="del" style="margin-top:10px">Delete this job</button>')+'</div>';

    app.innerHTML=html; window.scrollTo(0,0);
    renderClash(); renderTotals(); renderOffered();
  }
  function renderTotals(){
    if(!cur) return;
    var t=(Number(cur.price)||0)+(Number(cur.extras)||0);
    var el=$('#total'); if(el) el.textContent=money(t);
    var m=$('#margin');
    if(m){ var mg=(Number(cur.price)||0)-(Number(cur.driverFee)||0); m.textContent=(cur.price&&cur.driverFee)?('Your margin: '+money(mg)):''; }
  }
  function renderOffered(){
    var el=$('#offered'); if(!el||!cur) return;
    el.textContent=(cur.offered&&cur.offered.length)?('Already offered to: '+cur.offered.join(', ')):'';
  }
  function renderClash(){
    var el=$('#clash'); if(!el||!cur) return;
    var j=cur, out=[];
    if(j.date&&j.time){
      var t=toMin(j.time);
      jobs.forEach(function(o){
        if(o===j||o.date!==j.date||!o.time) return;
        if(o.status==='paid'||o.status==='completed') return;
        if(Math.abs(toMin(o.time)-t)<120){
          var same=j.driverId&&o.driverId===j.driverId;
          out.push((same?'<b>Same driver:</b> ':'')+esc(o.time)+' '+esc(o.pickup||'')+' to '+esc(o.dest||'')+(o.name?' ('+esc(o.name)+')':''));
        }
      });
    }
    el.innerHTML=out.length?'<div class="warn"><b>Possible clash</b><br>'+out.join('<br>')+'</div>':'';
  }

  /* ---------- parsing a pasted message ---------- */
  var MONTHMAP={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11,
    january:0,february:1,march:2,april:3,june:5,july:6,august:7,september:8,october:9,november:10,december:11};
  function parseDate(s){
    var m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
    m=s.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
    if(m){ var y=+m[3]; if(y<100) y+=2000; return y+'-'+pad(+m[2])+'-'+pad(+m[1]); }
    m=s.match(/(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?([A-Za-z]{3,9})\.?,?\s*(\d{4})?/);
    if(m && MONTHMAP[m[2].toLowerCase()]!==undefined){
      var mo=MONTHMAP[m[2].toLowerCase()], yy=m[3]?+m[3]:new Date().getFullYear();
      var iso=yy+'-'+pad(mo+1)+'-'+pad(+m[1]);
      if(!m[3] && iso<todayISO()) iso=(yy+1)+'-'+pad(mo+1)+'-'+pad(+m[1]);
      return iso;
    }
    return '';
  }
  function parseTime(s){
    var m=s.match(/(\d{1,2})[:.h](\d{2})\s*(am|pm)?/i);
    if(m){ var h=+m[1]; if(m[3]){ var ap=m[3].toLowerCase(); if(ap==='pm'&&h<12)h+=12; if(ap==='am'&&h===12)h=0; } if(h<24) return pad(h)+':'+m[2]; }
    m=s.match(/\b(\d{1,2})\s*(am|pm)\b/i);
    if(m){ var h2=+m[1]; var a=m[2].toLowerCase(); if(a==='pm'&&h2<12)h2+=12; if(a==='am'&&h2===12)h2=0; return pad(h2)+':00'; }
    return '';
  }
  var KEYS=[
    ['name',/^(client\s*name|passenger\s*name|passenger|full\s*name|name|client)$/i],
    ['phone',/^(mobile|mobile\s*number|mobile\s*no|phone|phone\s*number|tel|telephone|contact\s*number|contact|whatsapp)$/i],
    ['date',/^(date|travel\s*date|date\s*of\s*travel|pickup\s*date|pick\s*up\s*date)$/i],
    ['time',/^(time|pickup\s*time|pick\s*up\s*time|collection\s*time)$/i],
    ['pickup',/^(pickup|pick\s*up|pickup\s*address|pick\s*up\s*address|pickup\s*location|pick\s*up\s*location|collection|from|collect\s*from)$/i],
    ['stops',/^(additional\s*stops?|stops?|via|via\s*stops?|waypoints?)$/i],
    ['dest',/^(destination|drop\s*off|dropoff|drop\s*off\s*address|drop\s*off\s*location|drop\s*off\s*point|to|going\s*to)$/i],
    ['flight',/^(flight|flight\s*number|flight\s*no)$/i],
    ['pax',/^(passengers|no\s*of\s*passengers|number\s*of\s*passengers|pax)$/i],
    ['notes',/^(notes|note|comments|special\s*requests|additional\s*information|luggage)$/i]
  ];
  function parseEnquiry(text){
    var out={}, loose=[];
    text.split(/\r?\n/).forEach(function(raw){
      var line=raw.replace(/[*_~]/g,'').trim(); if(!line) return;
      var m=line.match(/^([^:]{2,32}):\s*(.+)$/), matched=false;
      if(m){
        var label=m[1].trim(), val=m[2].trim();
        for(var i=0;i<KEYS.length;i++){
          if(KEYS[i][1].test(label)){ var k=KEYS[i][0]; out[k]=(k==='notes'&&out[k])?out[k]+'; '+val:((k==='stops'&&out[k])?out[k]+'\n'+val:val); matched=true; break; }
        }
      }
      if(!matched) loose.push(line);
    });
    var all=text;
    if(!out.phone){ var pm=all.match(/(\+?44\s?\(?0?\)?\s?7\d{3}\s?\d{6}|07\d{3}\s?\d{6}|\+\d{9,14})/); if(pm) out.phone=pm[1]; }
    if(out.date) out.date=parseDate(out.date); else out.date=parseDate(all);
    if(out.time) out.time=parseTime(out.time); else out.time=parseTime(all);
    if(out.pax){ var pn=String(out.pax).match(/\d+/); out.pax=pn?pn[0]:''; }
    if(out.flight) out.flight=out.flight.replace(/\s+/g,'').toUpperCase();
    if(!out.name && !out.pickup && !out.dest && loose.length){
      var rest=loose.join(' ').replace(/\s+/g,' ').trim();
      out.notes=out.notes?out.notes+'; '+rest:rest;
    }
    return out;
  }

    });
    return names;
  }

  function digitsOf(x){ return String(x||'').replace(/\D/g,''); }
  function otherJobs(){ return jobs.filter(function(o){ return o!==cur; }); }
  function clientTrips(){
    var seen={}, out=[], list=otherJobs();
    for(var i=list.length-1;i>=0;i--){
      var o=list[i]; if(!o.name&&!o.phone) continue;
      var k=(normPhone(o.phone)||String(o.name).toLowerCase())+'|'+(o.pickup||'')+'|'+(o.dest||'');
      if(seen[k]) continue; seen[k]=1;
      out.push({name:o.name||'',phone:o.phone||'',pickup:o.pickup||'',stops:o.stops||'',dest:o.dest||'',pax:o.pax||'',notes:o.notes||''});
    }
    return out;
  }
  function clientSuggestions(q,field){
    q=String(q||'').trim().toLowerCase(); var qd=digitsOf(q);
    if(field==='phone'){ if(qd.length<3) return []; } else if(q.length<2) return [];
    var res=clientTrips().filter(function(t){
      if(field==='phone') return digitsOf(t.phone).indexOf(qd)>-1 || normPhone(t.phone).indexOf(normPhone(q))>-1;
      return t.name.toLowerCase().indexOf(q)>-1 || (qd.length>=3 && digitsOf(t.phone).indexOf(qd)>-1);
    });
    res.sort(function(a,b){ return (b.name.toLowerCase().indexOf(q)===0?1:0)-(a.name.toLowerCase().indexOf(q)===0?1:0); });
    return res.slice(0,6).map(function(t){
      var route=(t.pickup||t.dest)?(t.pickup||'?')+' to '+(t.dest||'?'):'';
      return {kind:'client',trip:t,label:t.name+(t.phone?'  \u00B7  '+t.phone:''),sub:route};
    });
  }
  function addressBook(){
    var map={}, seq=0, list=otherJobs();
    function add(a){ a=String(a||'').trim(); if(!a) return; var k=a.toLowerCase(); seq++; if(!map[k]) map[k]={a:a,n:0,last:0}; map[k].n++; map[k].last=seq; }
    list.forEach(function(o){ add(o.pickup); add(o.dest); stopList(o).forEach(add); });
    var saved=Object.keys(map);
    PLACES.forEach(function(p){
      var k=p.toLowerCase();
      var covered=saved.some(function(sk){ return sk.indexOf(k)>-1; });
      if(!covered) map[k]={a:p,n:0,last:0};
    });
    return Object.keys(map).map(function(k){ return map[k]; });
  }
  function lastLine(t){ var p=String(t||'').split(/\r?\n/); return p[p.length-1]||''; }
  function addressSuggestions(q,field){
    q=String(q||'').trim().toLowerCase(); if(q.length<2) return [];
    var words=q.split(/\s+/);
    var res=addressBook().filter(function(x){
      var l=x.a.toLowerCase(); if(l===q) return false;
      return words.every(function(w){ return l.indexOf(w)>-1; });
    });
    res.sort(function(a,b){
      var sa=a.a.toLowerCase().indexOf(q)===0?1:0, sb=b.a.toLowerCase().indexOf(q)===0?1:0;
      return (sb-sa)||(b.n-a.n)||(b.last-a.last);
    });
    return res.slice(0,6).map(function(x){ return {kind:'address',field:field,value:x.a,label:x.a,sub:x.n?('Used '+x.n+(x.n>1?' times':' time')):''}; });
  }

  function fmtLocal(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'; }
  function makeICS(j){
    var p=j.date.split('-').map(Number), t=(j.time||'09:00').split(':').map(Number);
    var start=new Date(p[0],p[1]-1,p[2],t[0],t[1]), end=new Date(start.getTime()+2*60*60*1000);
    var drv=getDriver(j.driverId);

    var now=new Date(); var stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
    return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VIG Executive//Jobs//EN','BEGIN:VEVENT',
      'UID:'+j.id+'@vigexecutive','DTSTAMP:'+stamp,'DTSTART:'+fmtLocal(start),'DTEND:'+fmtLocal(end),

    },
    delAll:function(el){
      armed(el,'Tap again to delete ALL jobs',function(){ jobs.forEach(function(o){ if(delIds.jobs.indexOf(o.id)<0) delIds.jobs.push(o.id); }); saveDel(); jobs=[]; saveJobs(); scheduleSync(); renderList(); toast('All jobs deleted'); });
    },
    addDriver:function(){ var nd={id:'d'+Date.now().toString(36),name:'New driver',phone:'',vehicle:''}; markDirty(nd); drivers.push(nd); saveDrivers(); scheduleSync(); renderDrivers(); },
    delDriver:function(el){
      var id=el.getAttribute('data-id');
      armed(el,'Tap again to remove',function(){
        if(delIds.drivers.indexOf(id)<0) delIds.drivers.push(id); saveDel(); drivers=drivers.filter(function(d){return d.id!==id;}); saveDrivers(); scheduleSync(); renderDrivers();
      });
    },
    shareics:function(){ if(cur) sendICS(cur); },
    closeSheet:function(){ var el=document.getElementById('sheet'); if(el) el.remove(); },
    copy:function(){ var ta=$('#msg'); copyText(ta?ta.value:''); },
    share:function(){
      var ta=$('#msg'), text=ta?ta.value:'';
      if(navigator.share){ navigator.share({text:text}).catch(function(){}); }
      else copyText(text);
    },
    login:async function(){
      var em=($('#em')||{}).value||'', pw=($('#pw')||{}).value||'', er=$('#loginerr');
      if(!em||!pw){ if(er){ er.style.display='block'; er.textContent='Enter your email and password.'; } return; }
      try{
        storeSession(await authCall('password',{email:em.trim(),password:pw}));
        var nav=$('nav'); if(nav) nav.style.display='';
        renderList(); setStat('Syncing...'); syncNow(); startPolling();
      }catch(e){
        if(er){ er.style.display='block'; er.textContent=e.isNetwork?'Cannot reach Supabase. Check your connection. If it keeps failing, the project may be paused.':e.message; }
      }
    },
    signout:function(){ session=null; sSet('vig_session_v1',null); renderLogin(); },
    syncnow:function(){ toast('Syncing...'); syncNow().then(function(){ if(view==='drivers') renderDrivers(); toast(syncErr&&!lastSync?'Sync problem':'Synced'); }); },
    backup:function(){ download('vig-jobs-backup-'+todayISO()+'.json','application/json',JSON.stringify({jobs:jobs,drivers:drivers})); }
  };

  /* ---------- sync with Supabase (jobs shared between devices) ---------- */
  var SUPABASE_URL='https://kyrcqqwcopexhnzlkmfs.supabase.co';
  var SUPABASE_KEY='sb_publishable_81HY9lR_85TnAgrMGT_K2A_pVoGTVp4';
  var syncOn=SUPABASE_KEY.indexOf('PASTE')!==0;
  var session=sGet('vig_session_v1',null);
  var delIds=sGet('vig_deleted_v1',{jobs:[],drivers:[]});
  var syncing=false, syncTimer=null, pollT=null, lastSync=0;
  function saveDel(){ sSet('vig_deleted_v1',delIds); }
  function sig(o){ var c={}; Object.keys(o).forEach(function(k){ if(k.charAt(0)!=='_') c[k]=o[k]; }); return JSON.stringify(c); }
  function markDirty(o){ o._u=Date.now(); o._d=true; }
  function rowFor(o){
    var c={}; Object.keys(o).forEach(function(k){ if(k.charAt(0)!=='_'||k==='_u') c[k]=o[k]; });
    return {id:o.id,data:c,updated_at:new Date(o._u||Date.now()).toISOString()};
  }
  function setStat(t){ var e=document.getElementById('syncstat'); if(e) e.textContent=t||''; }
  function netErr(){ var e=new Error('offline'); e.isNetwork=true; return e; }
  function scheduleSync(){ if(!syncOn||!session) return; clearTimeout(syncTimer); syncTimer=setTimeout(function(){ syncNow(); },900); }

  async function authCall(grant,body){
    var res;
    try{ res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    catch(e){ throw netErr(); }
    var j={}; try{ j=await res.json(); }catch(e){}
    if(!res.ok) throw new Error(j.error_description||j.msg||j.message||'Sign in failed');
    return j;
  }
  function storeSession(j){
    session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,
      email:(j.user&&j.user.email)||(session&&session.email)||''};
    sSet('vig_session_v1',session);
  }
  async function token(){
    if(!session) throw new Error('signed out');
    if(session.expires_at-Date.now()<60000){
      try{ storeSession(await authCall('refresh_token',{refresh_token:session.refresh_token})); }
      catch(e){ if(e.isNetwork) throw e; throw new Error('signed out'); }
    }
    return session.access_token;
  }
  async function rest(method,path,body,prefer){
    var t=await token();
    var h={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+t};
    if(body) h['Content-Type']='application/json';
    if(prefer) h['Prefer']=prefer;
    var res;
    try{ res=await fetch(SUPABASE_URL+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined}); }
    catch(e){ throw netErr(); }
    if(res.status===401) throw new Error('signed out');
    if(!res.ok){ var tx=''; try{ tx=await res.text(); }catch(e){} throw new Error('Supabase '+res.status+' '+tx.slice(0,140)); }
    if(method==='GET') return res.json();
    return null;
  }
  async function pullTable(table){
    var out=[], off=0;
    for(;;){
      var rows=await rest('GET',table+'?select=id,data&order=id&limit=1000&offset='+off);
      out=out.concat(rows); if(rows.length<1000) break; off+=1000;
    }
    return out;
  }
  async function pushDirty(name,table,arr){
    var dirty=arr.filter(function(o){ return o._d&&!o._seed; });
    if(dirty.length){
      var sent=dirty.map(function(o){ return {o:o,u:o._u}; });
      await rest('POST',table+'?on_conflict=id',dirty.map(rowFor),'resolution=merge-duplicates,return=minimal');
      sent.forEach(function(x){ if(x.o._u===x.u) x.o._d=false; x.o._s=true; });
    }
    var ids=delIds[name].slice();
    if(ids.length){
      await rest('DELETE',table+'?id=in.('+ids.map(encodeURIComponent).join(',')+')');
      delIds[name]=delIds[name].filter(function(id){ return ids.indexOf(id)<0; }); saveDel();
    }
  }
  function mergeInto(name,arr,rows,skip,dropSeeds){
    var changed=false, remote={};
    if(dropSeeds&&rows.length){ for(var k=arr.length-1;k>=0;k--) if(arr[k]._seed){ arr.splice(k,1); changed=true; } }
    rows.forEach(function(r){
      remote[r.id]=1;
      if(delIds[name].indexOf(r.id)>-1) return;
      var data=r.data||{}; data.id=r.id;
      var local=null; for(var i=0;i<arr.length;i++) if(arr[i].id===r.id){ local=arr[i]; break; }
      if(!local){ data._s=true; data._d=false; data._sig=sig(data); arr.push(data); changed=true; return; }
      if(local===skip) return;
      if(local._d){ return; }
      if((data._u||0)>(local._u||0)){
        Object.keys(local).forEach(function(k){ delete local[k]; });
        Object.keys(data).forEach(function(k){ local[k]=data[k]; });
        local._s=true; local._d=false; local._sig=sig(local); changed=true;
      } else local._s=true;
    });
    for(var j=arr.length-1;j>=0;j--){
      var o=arr[j]; if(remote[o.id]||o===skip) continue;
      if(o._s&&!o._d){ arr.splice(j,1); changed=true; }
    }
    arr.forEach(function(o){ if(!o._s&&!o._d&&!o._seed){ o._d=true; o._u=o._u||Date.now(); } });
    return changed;
  }
  async function syncNow(){
    if(!syncOn||!session||syncing) return;
    syncing=true; setStat('Syncing...');
    try{
      await pushDirty('jobs','vig_jobs',jobs);
      await pushDirty('drivers','vig_drivers',drivers);
      var jr=await pullTable('vig_jobs'), dr=await pullTable('vig_drivers');
      var c1=mergeInto('jobs',jobs,jr,cur,false);
      mergeInto('drivers',drivers,dr,null,true);
      await pushDirty('jobs','vig_jobs',jobs);
      await pushDirty('drivers','vig_drivers',drivers);
      saveJobs(); saveDrivers();
      lastSync=Date.now(); setStat('Synced');
      if(c1&&view==='list') renderList();
    }catch(e){
      if(e.message==='signed out'){ session=null; sSet('vig_session_v1',null); renderLogin(); }
      else if(e.isNetwork) setStat('Offline, saved on this device');
      else setStat('Sync problem');
      syncErr=e.message;
    }finally{ syncing=false; }
  }
  var syncErr='';
  window.vigSyncNow=syncNow;
  function startPolling(){
    if(pollT) return;
    pollT=setInterval(function(){ if(document.visibilityState==='visible') syncNow(); },15000);
  }
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') syncNow(); });
  window.addEventListener('online',function(){ syncNow(); });

  function renderLogin(msg){
    hideSugg(); view='login'; cur=null;
    var nav=$('nav'); if(nav) nav.style.display='none';
    setStat('');
    app.innerHTML='<div class="card" style="margin-top:20px"><h3>Sign in</h3>'+
      '<div class="note">Sign in with the email and password you created in Supabase. Once signed in, your jobs are shared between your phone and your computer.</div>'+
      '<label>Email</label><input id="em" type="email" autocomplete="username" autocapitalize="none" autocorrect="off">'+
      '<label>Password</label><input id="pw" type="password" autocomplete="current-password">'+
      '<div class="warn" id="loginerr" style="display:'+(msg?'block':'none')+'">'+esc(msg||'')+'</div>'+
      '<button class="btn" data-act="login">Sign in</button></div>';
  }
  function boot(){
    jobs.forEach(function(o){ if(!o._sig) o._sig=sig(o); });
    if(!syncOn){ renderList(); return; }
    if(!session){ renderLogin(); return; }
    renderList(); setStat('Syncing...'); syncNow(); startPolling();
  }

  /* ---------- events ---------- */
  document.addEventListener('click',function(e){
    var sg=e.target.closest('[data-sugg]');
    if(sg){ applySugg(+sg.getAttribute('data-sugg')); return; }
    if(!e.target.closest('#sugg') && !(e.target.getAttribute&&e.target.getAttribute('data-f'))) hideSugg();
    var t=e.target.closest('[data-act],[data-nav],[data-filter],.job');
    if(!t) return;
    if(t.hasAttribute('data-nav')){
      var n=t.getAttribute('data-nav');
      if(cur) persistCur();
      if(n==='list') renderList();
      else if(n==='drivers') renderDrivers();
      else { cur=newJob(); renderEditor(); }
      return;
    }
    if(t.hasAttribute('data-filter')){ filter=t.getAttribute('data-filter'); renderList(); return; }
    if(t.classList.contains('job')){
      var id=t.getAttribute('data-id');
      for(var i=0;i<jobs.length;i++) if(jobs[i].id===id){ cur=jobs[i]; break; }
      renderEditor(); return;
    }
    var a=t.getAttribute('data-act');
    if(actions[a]) actions[a](t);
  });

  function onField(e){
    var el=e.target, f=el.getAttribute('data-f'), dd=el.getAttribute('data-d');
    if(el.id==='msg'){ var wa=$('#wa-open'); if(wa) wa.href=waHref(sendCtx.phone,el.value); return; }
    if(dd){
      var id=el.getAttribute('data-id');
      for(var i=0;i<drivers.length;i++) if(drivers[i].id===id){ drivers[i][dd]=el.value; delete drivers[i]._seed; markDirty(drivers[i]); break; }
      saveDrivers(); scheduleSync(); return;
    }
    if(!f||!cur) return;
    cur[f]=el.value;
    if(f==='driverId'){
      var d=getDriver(el.value);
      if(d&&d.vehicle&&!cur.vehicle){ cur.vehicle=d.vehicle; var vi=$('#f-vehicle'); if(vi) vi.value=d.vehicle; }
    }
    persistCur();
    if(f==='name'||f==='phone'){ if(e.type==='input') showSugg(el,clientSuggestions(el.value,f)); }
    else if(f==='pickup'||f==='dest'||f==='stops'){ if(e.type==='input') showSugg(el,addressSuggestions(f==='stops'?lastLine(el.value):el.value,f)); }
    else hideSugg();
    if(f==='date'||f==='time'||f==='driverId') renderClash();
    if(f==='price'||f==='driverFee'||f==='extras') renderTotals();
    if(f==='driverId') renderOffered();
  }
  document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.id==='pw') actions.login(); });
  document.addEventListener('input',onField);
  document.addEventListener('change',function(e){
    if(e.target.id==='restore'){
      var file=e.target.files[0]; if(!file) return;
      var r=new FileReader();
      r.onload=function(){
        try{
          var data=JSON.parse(r.result);
          if(!Array.isArray(data.jobs)||!Array.isArray(data.drivers)) throw new Error('bad');
                    jobs=data.jobs; drivers=data.drivers; jobs.concat(drivers).forEach(function(o){ delete o._s; delete o._seed; markDirty(o); if(o.status!==undefined) o._sig=sig(o); }); saveJobs(); saveDrivers(); scheduleSync(); toast('Backup restored'); renderList();
        }catch(err){ toast('That file is not a valid backup'); }
      };
      r.readAsText(file); return;
    }
    onField(e);
  });

  boot();
})();
